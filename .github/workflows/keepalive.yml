# Supabase pauses idle free projects; a few cheap requests a day keeps it awake through the Jan–Apr gap.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 */6 * * *' # docs: 'a few user requests each day'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/teams?select=id&limit=1"
          -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" -o /dev/null
