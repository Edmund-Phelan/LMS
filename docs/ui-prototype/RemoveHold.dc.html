<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hold to remove your pick (proposed)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050a1f}
a{color:#f2b226}a:hover{color:#ffd166}
.app{font-family:'Barlow',system-ui,sans-serif;color:#f4f1e8;-webkit-font-smoothing:antialiased}
.disp{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
p,h1,h2{margin:0}
.stripes{background:radial-gradient(120% 80% at 50% -20%,rgba(255,255,255,.18),transparent 60%),repeating-linear-gradient(90deg,#13235a 0 12.5%,#0f1d4c 12.5% 25%)}
.tc{height:118px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;box-sizing:border-box;min-width:0;width:100%}
.tc img{width:48px;height:48px;object-fit:contain}
.tn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;line-height:1.05}
.ts{font-size:11px;font-weight:600;opacity:.75}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050a1f">
  <header style="padding: 16px 16px 10px">
    <p style="font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #a8b3d1">Last Man Standing</p>
    <p class="disp" style="font-size: 21px; line-height: 1.05">Round 1</p>
  </header>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 18px">
    <section class="stripes" style="height: 200px; border-radius: 24px"></section>
    <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 14px; border-radius: 20px; background: #c8102e; padding: 14px 16px">
        <span style="width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center"><img src="../../public/crests/munster-rugby.png" alt="" style="width: 38px; height: 38px; object-fit: contain"></span>
        <div><p style="font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85">Your pick</p><p class="disp" style="font-size: 26px; line-height: 1.05">Munster</p></div>
      </div>
    </sc-if>
    <sc-if value="{{removed}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 14px; border-radius: 20px; border: 2px dashed #f2b226; background: rgba(242,178,38,.07); padding: 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f2b226" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <div>
          <p class="disp" style="font-size: 22px">No pick yet</p>
          <p style="font-size: 13px; color: #cdd5ea">No pick in Round 1 means no entry. Tap a team below.</p>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr); align-items: center">
        <button type="button" class="tc" style="background: #c8102e; color: #fff"><img src="../../public/crests/munster-rugby.png" alt=""><span class="tn">Munster</span><span class="ts">Home</span></button>
        <span class="disp" style="text-align: center; font-size: 14px; color: #f2b226">v</span>
        <button type="button" class="tc" style="background: #c2e0f7; color: #000"><img src="../../public/crests/racing-92.png" alt=""><span class="tn">Racing 92</span><span class="ts">Away</span></button>
      </div>
      <button type="button" onClick="{{reset}}" style="align-self: center; min-height: 44px; padding: 0 16px; font-size: 13px; font-weight: 700; color: #a8b3d1; text-decoration: underline">Try the hold again</button>
    </sc-if>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(3,7,24,.66)"></div>
    <section role="dialog" aria-label="Remove your pick" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; overflow: hidden; background: #14224f; box-shadow: 0 -20px 60px rgba(0,0,0,.45)">
      <div style="position: relative; height: 112px; overflow: hidden; background: #c8102e">
        <span aria-hidden="true" style="position: absolute; top: 30px; left: -20%; width: 140%; height: 40px; transform: rotate(-8deg); opacity: .35; background: #122053"></span>
        <span aria-hidden="true" style="position: absolute; top: 10px; left: 50%; margin-left: -20px; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.5)"></span>
      </div>
      <div style="position: relative; margin-top: -52px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 22px 30px; text-align: center">
        <span style="width: 96px; height: 96px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(0,0,0,.35)"><img src="../../public/crests/munster-rugby.png" alt="" style="width: 70px; height: 70px; object-fit: contain"></span>
        <span class="disp" style="margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: .2em; color: #f2b226">YOUR PICK</span>
        <span class="disp" style="font-size: 34px; line-height: .95">Remove Munster?</span>
        <span style="font-size: 14px; color: #a8b3d1">Munster v Racing 92 · Sat 20:00 · Home</span>
        <span style="margin: 14px 0 6px; width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 10px; border-radius: 14px; background: rgba(255,178,62,.1); padding: 12px 14px; font-size: 14px; line-height: 1.35; font-weight: 600; color: #ffcf7a; text-align: left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          No pick in Round 1 means no entry. Pick again before the lock.
        </span>
        <button type="button" aria-label="Hold to remove Munster" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}" onContextMenu="{{noMenu}}" style="position: relative; overflow: hidden; width: 100%; height: 56px; border-radius: 16px; background: rgba(229,72,77,.2); box-shadow: inset 0 0 0 1px rgba(255,138,138,.55); touch-action: none; user-select: none; -webkit-user-select: none">
          <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: #e5484d; {{fillStyle}}"></span>
          <span class="disp" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; color: #ffffff">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V6a2 2 0 0 1 4 0v5"></path><path d="M13 10.5V9a2 2 0 0 1 4 0v4.5"></path><path d="M17 12a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1.5a7 7 0 0 1-5.6-2.8L4 16a2 2 0 0 1 3.2-2.4L9 15.5V11"></path></svg>
            {{label}}
          </span>
        </button>
        <sc-if value="{{hint}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; font-weight: 600; color: #ffcf7a">Keep holding to remove</span>
        </sc-if>
        <button type="button" style="margin-top: 8px; width: 100%; height: 50px; border-radius: 16px; border: 1px solid rgba(255,255,255,.18); font-weight: 700">Keep Munster</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const HOLD_MS = 600;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'sheet', holding: false, hint: false };
    this.timer = null;
  }
  componentWillUnmount() {
    clearTimeout(this.timer);
  }
  start() {
    if (this.state.holding || this.state.phase !== 'sheet') return;
    clearTimeout(this.timer);
    this.setState({ holding: true, hint: false });
    this.timer = setTimeout(() => this.setState({ holding: false, phase: 'removed' }), HOLD_MS);
  }
  stop() {
    if (!this.state.holding) return;
    clearTimeout(this.timer);
    this.setState({ holding: false, hint: true });
  }
  renderVals() {
    const h = this.state.holding;
    return {
      sheet: this.state.phase === 'sheet',
      removed: this.state.phase === 'removed',
      fillStyle: h ? 'width: 100%; transition: width ' + HOLD_MS + 'ms linear' : 'width: 0%; transition: none',
      label: h ? 'Keep holding…' : 'Hold to remove Munster',
      hint: this.state.hint && !h,
      down: (e) => { if (e && e.preventDefault) e.preventDefault(); this.start(); },
      up: () => this.stop(),
      keyDown: (e) => { if (e.key !== ' ' && e.key !== 'Enter') return; e.preventDefault(); if (!e.repeat) this.start(); },
      keyUp: (e) => { if (e.key !== ' ' && e.key !== 'Enter') return; e.preventDefault(); this.stop(); },
      noMenu: (e) => e.preventDefault(),
      reset: () => this.setState({ phase: 'sheet', hint: false })
    };
  }
}
</script>
</body>
</html>
